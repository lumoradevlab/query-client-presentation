<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یادداشت گوینده — جلسه‌ی ۲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#161826;--surf:#232532;--line:rgba(233,233,237,.13);--text:#e9e9ed;--dim:#a3a7b9;--faint:#75798c;
  --accent:#9184d9;--accent-2:#b5abfc;--accent-soft:rgba(145,132,217,.14);--good:#86d3ad;--warn:#e6b98a;--fs:1;
  --font:'Inter','Vazirmatn',system-ui,sans-serif;--mono:'JetBrains Mono','Vazirmatn',ui-monospace,monospace}
html[data-theme="light"]{--bg:#f3f5fe;--surf:#e6e9f6;--line:rgba(22,24,38,.13);--text:#161826;--dim:#4b4f60;--faint:#6b6f80;
  --accent:#5d5294;--accent-2:#5d5294;--accent-soft:rgba(93,82,148,.10);--good:#1f6b4b;--warn:#8a5a1c}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surf)}
.top .info{flex:1;min-width:0}
.num{font:13px var(--mono);color:var(--faint);direction:ltr;text-align:right}
.title{font-size:calc(22px * var(--fs));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--warn);white-space:nowrap}
.status.ok{color:var(--good)}
.btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;font:15px var(--font)}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.clock{display:flex;gap:18px;padding:10px 22px;border-bottom:1px solid var(--line);font:15px var(--mono);color:var(--dim);direction:ltr;justify-content:flex-end}
.clock b{color:var(--text);font-weight:500}
.clock button{background:none;border:none;color:var(--accent-2);cursor:pointer;font:13px var(--mono)}
main{flex:1;overflow-y:auto;padding:24px 28px 30px}
.time{display:inline-block;font:13px var(--mono);color:var(--accent-2);background:var(--accent-soft);padding:2px 10px;border-radius:999px;margin-bottom:14px}
.note p,.note li{font-size:calc(18px * var(--fs));line-height:1.95;color:var(--dim);margin-bottom:10px}
.note b{color:var(--text)}
.note ol,.note ul{padding-right:24px;margin-bottom:10px}
.next{padding:14px 22px;border-top:1px solid var(--line);background:var(--surf);font-size:15px;color:var(--faint)}
.next b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="info"><div class="num" id="num">— / —</div><div class="title" id="title">در انتظار اتصال به ارائه…</div></div>
    <span class="status" id="status">بدون اتصال</span>
    <button class="btn" id="prev" title="Previous">›</button>
    <button class="btn" id="next" title="Next">‹</button>
    <button class="btn" id="fsm" title="Smaller">A−</button>
    <button class="btn" id="fsp" title="Larger">A+</button>
  </div>
  <div class="clock">
    <span>elapsed <b id="elapsed">00:00</b> <button id="reset">reset</button></span>
    <span>now <b id="now">--:--</b></span>
  </div>
  <main><span class="time" id="dur"></span><div class="note" id="note"><p>این پنجره را از داخل ارائه با کلید N باز کنید تا همگام شود.</p></div></main>
  <div class="next" id="nextSlide"></div>
</div>
<script src="notes-data.js"></script>
<script>
const CHANNEL = 'qc-s2';
const chan = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null;
const $ = id => document.getElementById(id);
let fs = 1, start = Date.now();

function send(msg){
  if (window.opener && !window.opener.closed) { try { window.opener.postMessage(msg, '*'); return; } catch(e){} }
  if (chan) chan.postMessage(msg);
}
function onState(d){
  if (!d || d.type !== 'state') return;
  $('status').textContent = 'همگام'; $('status').classList.add('ok');
  $('num').textContent = (d.index + 1) + ' / ' + d.total + (d.steps ? '  ·  build ' + d.step + ' / ' + d.steps : '');
  $('title').textContent = d.title || d.id;
  const n = (window.NOTES || {})[d.id];
  $('dur').textContent = n && n.time ? '⏱ ' + n.time : '';
  $('dur').style.display = n && n.time ? '' : 'none';
  $('note').innerHTML = n ? n.html : '<p>برای این اسلاید یادداشتی نیست.</p>';
  $('nextSlide').innerHTML = d.next ? 'بعدی: <b>' + d.next + '</b>' : 'آخرین اسلاید';
  if (d.theme === 'light') document.documentElement.dataset.theme = 'light';
  else delete document.documentElement.dataset.theme;
  document.querySelector('main').scrollTop = 0;
}
if (chan) chan.onmessage = e => onState(e.data);
addEventListener('message', e => onState(e.data));

$('prev').onclick = () => send({type:'nav', dir:-1});
$('next').onclick = () => send({type:'nav', dir:1});
$('fsm').onclick = () => { fs = Math.max(.8, fs - .1); document.documentElement.style.setProperty('--fs', fs); };
$('fsp').onclick = () => { fs = Math.min(1.6, fs + .1); document.documentElement.style.setProperty('--fs', fs); };
$('reset').onclick = () => { start = Date.now(); tick(); };
addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); send({type:'nav', dir:1}); }
  if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); send({type:'nav', dir:-1}); }
});
const pad = n => String(n).padStart(2, '0');
function tick(){
  const s = Math.floor((Date.now() - start) / 1000);
  $('elapsed').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  const d = new Date(); $('now').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
}
setInterval(tick, 1000); tick();
send({type:'hello'});
</script>
</body>
</html>
